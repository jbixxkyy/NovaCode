name: publish
run-name: "release ${{ inputs.bump || inputs.version }}"

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Bump major, minor, or patch"
        required: false
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      version:
        description: "Override version (optional e.g. 1.18.23)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v1

      - name: Setup git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        shell: pwsh
        run: |
          $pkgPath = "packages/desktop/package.json"
          $pkg = Get-Content $pkgPath | ConvertFrom-Json
          $current = $pkg.version
          $bump = "${{ inputs.bump }}"
          $override = "${{ inputs.version }}"
          if ($override) {
            $next = $override
          } else {
            $parts = $current.Split('.')
            $major = [int]$parts[0]; $minor = [int]$parts[1]; $patch = [int]$parts[2]
            if ($bump -eq "major") { $major++; $minor=0; $patch=0 }
            elseif ($bump -eq "minor") { $minor++; $patch=0 }
            else { $patch++ }
            $next = "$major.$minor.$patch"
          }
          Write-Host "Bumping $current -> $next"
          $pkg.version = $next
          $pkg | ConvertTo-Json -Depth 10 | Set-Content $pkgPath -Encoding utf8
          git add $pkgPath
          git commit -m "chore(desktop): bump to $next" --no-verify
          git push origin HEAD:main --no-verify
          echo "VERSION=$next" >> $env:GITHUB_ENV

      - name: Install node-gyp
        run: npm install -g node-gyp

      - name: Build desktop
        run: bun run --cwd packages/desktop build
        env:
          NOVACODE_CHANNEL: prod
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Package Windows
        working-directory: packages/desktop
        run: npx electron-builder --win --config electron-builder.config.ts --publish never
        env:
          NOVACODE_CHANNEL: prod
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        working-directory: packages/desktop
        shell: pwsh
        run: |
          $ver = $env:VERSION
          if (-not $ver) { $ver = (Get-Content package.json | ConvertFrom-Json).version }
          Write-Host "Creating release v$ver"
          gh release create "v$ver" --title "v$ver" --generate-notes --repo jbixxkyy/NovaCode dist/latest.yml dist/novacode-desktop-win-x64.exe dist/novacode-desktop-win-x64.exe.blockmap --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

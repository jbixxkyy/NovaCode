<svg width="700" height="200" viewBox="0 0 700 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Bungee+Shade&display=swap');
      .word { font-family: 'Bungee Shade', 'Impact', sans-serif; }
    </style>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="55%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="50%" stop-color="#7dd3fc" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="700" height="200" fill="#0b0f19"/>

  <!-- Orbit icon -->
  <g transform="translate(30,40)">
    <rect width="120" height="120" rx="26" fill="#0b0f19"/>
    <circle cx="60" cy="60" r="26" fill="url(#glow)"/>
    <ellipse cx="60" cy="60" rx="42" ry="16" fill="none" stroke="url(#g)" stroke-width="3" transform="rotate(-20 60 60)"/>
    <ellipse cx="60" cy="60" rx="42" ry="16" fill="none" stroke="url(#g)" stroke-width="3" opacity="0.5" transform="rotate(40 60 60)"/>
    <circle cx="60" cy="60" r="10" fill="#ffffff"/>
    <circle cx="18" cy="52" r="4" fill="url(#g)"/>
    <circle cx="98" cy="80" r="4" fill="url(#g)"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(175,0)">
    <text class="word" x="0" y="118" font-size="52" fill="#f1f5f9">nova<tspan fill="url(#g)">code</tspan></text>
  </g>
</svg>